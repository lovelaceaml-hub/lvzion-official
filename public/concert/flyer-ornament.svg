      <use href="#blade" transform="translate(17 43) rotate(37)"/>
      <use href="#blade" transform="translate(14 40) rotate(-25) scale(.79)"/>
      <use href="#blade" transform="translate(25 32) rotate(-29)"/>
      <use href="#blade" transform="translate(33 23) rotate(-15) scale(.86)"/>
      <use href="#blade" transform="translate(39 25) rotate(71) scale(.85)"/>
      <use href="#blade" transform="translate(44 15) rotate(47) scale(.87)"/>
      <use href="#blade" transform="translate(54 8) rotate(55) scale(.67)"/>
